# CoreBuild deck builder, to run next to your existing Open WebUI container.
#
#   cp .env.example .env    # then edit PUBLIC_URL and API_KEY
#   docker compose up -d --build
#
# If Open WebUI runs in another compose project, attach this service to that project's
# network (see OPENWEBUI_NETWORK in .env) so Open WebUI can reach it as http://deck-builder:8000.
services:
  deck-builder:
    build: ./deck-builder
    container_name: deck-builder
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8010}
      API_KEY: ${API_KEY:-}
      KEEP_DAYS: ${KEEP_DAYS:-14}
    ports:
      - "${DECK_BUILDER_PORT:-8010}:8000"
    volumes:
      - deck-output:/data/out
    networks:
      - default
      - openwebui

volumes:
  deck-output:

networks:
  openwebui:
    external: true
    name: ${OPENWEBUI_NETWORK:-open-webui_default}
